name: Publish

# Push a tag such as v0.1.0-preview.1 to test, pack and publish that version to nuget.org.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub release
  id-token: write # NuGet trusted publishing (OIDC), no API key stored in the repository

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test RedisCrud.sln -c Release

      - name: Pack
        run: dotnet pack src/RedisCrud -c Release --no-build -o artifacts

      - name: Check version matches tag
        run: |
          expected="${GITHUB_REF_NAME#v}"
          test -f "artifacts/RedisCrud.${expected}.nupkg" || { echo "Package version does not match tag $GITHUB_REF_NAME"; ls artifacts; exit 1; }

      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to nuget.org
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags="--generate-notes"
          case "$GITHUB_REF_NAME" in *-*) flags="$flags --prerelease";; esac
          gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg artifacts/*.snupkg $flags
