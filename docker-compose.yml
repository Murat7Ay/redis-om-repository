# Local development stack. Secrets are read from the environment / a .env file, never committed:
#   AUTH_SIGNING_KEY=<at least 32 random bytes>  BOOTSTRAP_ADMIN_PASSWORD=<password>  docker compose up -d
services:
  redis:
    image: redis:8
    # AOF with fsync every second: history and audit data survive a restart (at most ~1s of writes lost on crash).
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data

  api:
    build:
      context: .
      dockerfile: samples/CrudApp/Dockerfile
    ports:
      - "127.0.0.1:5259:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Crud__ConnectionString=redis:6379
      - Auth__SigningKey=${AUTH_SIGNING_KEY:?set AUTH_SIGNING_KEY}
      - Auth__BootstrapAdmin__Name=admin
      - Auth__BootstrapAdmin__Password=${BOOTSTRAP_ADMIN_PASSWORD:?set BOOTSTRAP_ADMIN_PASSWORD}
    depends_on:
      - redis

volumes:
  redis-data:
